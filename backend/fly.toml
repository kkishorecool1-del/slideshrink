# fly.toml - Deploy backend to Fly.io
# 1. Install flyctl: https://fly.io/docs/hands-on/install-flyctl/
# 2. Run: flyctl launch --from backend
# 3. Select this file when prompted, or let flyctl generate it
# 4. Run: flyctl deploy
# 5. Run: flyctl volumes create slideshrink_data --size 1
# 6. Set CORS origins: flyctl secrets set SLIDESHRINK_CORS_ORIGINS=https://your-site-name.netlify.app

app = "slideshrink-backend"
primary_region = "iad"  # Change to your nearest region

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHON_VERSION = "3.11"
  SLIDESHRINK_DATA_DIR = "/var/data/slideshrink"
  SLIDESHRINK_JOB_TTL_SECONDS = "3600"
  SLIDESHRINK_MAX_UPLOAD_BYTES = "104857600"
  # Set SLIDESHRINK_CORS_ORIGINS via flyctl secrets (not here)

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "slideshrink_data"
  destination = "/var/data/slideshrink"

[health_check]
  path = "/api/health"
  interval = "30s"
  timeout = "10s"
  grace_period = "10s"