# fly.toml — Deploy ENTIRE app (frontend + backend, single service) to Fly.io
# Region: bom (Mumbai) for lowest latency to Indian users.
# This uses the root Dockerfile (multi-stage: builds React frontend, serves it
# from FastAPI same-origin). No CORS or split-deploy needed.
#
# Steps:
#   1. Install flyctl:  curl -L https://fly.io/install.sh | sh
#   2. Login:           flyctl auth login
#   3. Launch (reuse this file):  flyctl launch --no-deploy
#      - when asked for app name: pick e.g. slideshrink (or slideshrink-xyz)
#      - when asked for region: choose bom (Mumbai)
#      - say NO to Postgres/Redis (not needed)
#   4. Volume (optional persistence across deploys): flyctl volumes create slideshrink_data --size 1 --region bom
#      (skip if you prefer ephemeral /tmp storage — jobs auto-clean after TTL)
#   5. Deploy:          flyctl deploy
#   6. Open:            flyctl open
#
# Pricing: shared-cpu-1x (1 CPU, 256MB→512MB here) fits free allowance;
# machines auto-stop when idle and start on request (see [http_service]).

app = "slideshrink"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly sets PORT automatically; our CMD honors ${PORT:-7860}.
  SLIDESHRINK_JOB_TTL_SECONDS = "3600"
  SLIDESHRINK_MAX_UPLOAD_BYTES = "104857600"
  SLIDESHRINK_MAX_WORKERS = "3"
  # Same-origin single service: no CORS origins needed.
  SLIDESHRINK_CORS_ORIGINS = ""
  # Ephemeral storage by default (jobs cleaned after TTL). If you create the
  # volume above, uncomment the mount + set this to /var/data/slideshrink.
  SLIDESHRINK_DATA_DIR = "/tmp/slideshrink-data"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/api/health"

# Uncomment if you created the slideshrink_data volume:
# [[mounts]]
#   source = "slideshrink_data"
#   destination = "/var/data/slideshrink"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
