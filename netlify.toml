[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# NOTE: Recommended deploy is single-service on Render (see render.yaml + Dockerfile).
# The frontend is served by FastAPI same-origin, so no /api redirect is needed.
# Only if you do a split deploy (Netlify frontend + separate backend), add a
# redirect in the Netlify UI, or uncomment below with your backend URL:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"